<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Terminal</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0f1117; color: #d7d7d7; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #status { flex: none; padding: 6px 10px; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 8px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex: none; }
  #dot.connected { background: #4ade80; }
  #dot.error { background: #f87171; }
  #output { flex: 1; overflow: auto; padding: 10px; white-space: pre-wrap; word-break: break-all; font-size: 12px; line-height: 1.5; }
  #inputRow { flex: none; display: flex; border-top: 1px solid rgba(255,255,255,0.1); }
  #prompt { padding: 8px 4px 8px 10px; color: #7dd3fc; }
  #input { flex: 1; background: transparent; border: none; color: inherit; font: inherit; font-size: 12px; padding: 8px 10px 8px 0; outline: none; }
  button { background: rgba(255,255,255,0.08); border: none; color: inherit; font-size: 11px; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<div id="app">
  <div id="status">
    <span id="dot"></span>
    <span id="statusText">Connecting…</span>
    <span style="flex:1"></span>
    <button id="reconnect">Reconnect</button>
  </div>
  <div id="output"></div>
  <div id="inputRow">
    <span id="prompt">$</span>
    <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="type a command and press Enter" />
  </div>
</div>
<script>
// Terminal app — reference/example UI for user-specs/002-service-daemons,
// bundled with the Terminal Service in the same item (user-apps/terminal/).
// Line-oriented, not a full raw-mode terminal (no ANSI/xterm.js) — kept
// dependency-free and simple, since its purpose is exercising the service
// daemon lifecycle end to end, not being a production terminal emulator.
//
// Two ways this page runs, and they connect differently:
//   - As an installed app (a desktop window): BOS injects window.__bos, and the
//     shell socket is opened through it — window.__bos.services.connect().
//     The socket then lives in the trusted BOS page, which sends the user's
//     session cookie with it. Opening it from in here instead does NOT: an app
//     installed from a marketplace runs in an opaque-origin sandbox, so its own
//     socket is cross-site and the session cookie is left off — behind an
//     authenticating front door (Bastion) that is a 401, reported by Chrome as
//     "HTTP Authentication failed; no valid credentials available".
//   - Opened directly in a tab (Settings → Services → Open App): no
//     window.__bos, but the page is same-origin, so it reads its own service
//     config and opens the socket itself.
// See BOS docs/dev/apps/services.md §11–§12.

const outputEl = document.getElementById("output");
const inputEl = document.getElementById("input");
const dotEl = document.getElementById("dot");
const statusEl = document.getElementById("statusText");
const reconnectBtn = document.getElementById("reconnect");

let ws = null;

function appendOutput(text) {
  outputEl.textContent += text;
  outputEl.scrollTop = outputEl.scrollHeight;
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  dotEl.className = cls || "";
}

function attach(socket, label) {
  ws = socket;
  setStatus(`Connecting to ${label}…`);
  ws.onopen = () => {
    setStatus(`Connected — ${label}`, "connected");
    inputEl.focus();
  };
  ws.onmessage = (event) => appendOutput(event.data);
  ws.onclose = () => {
    if (!statusEl.textContent.startsWith("Connection error")) setStatus("Disconnected", "");
  };
  // A broker-refused open carries the reason (e.g. capability not granted,
  // service not running); a browser WebSocket error never does.
  ws.onerror = (event) => setStatus("Connection error" + (event && event.message ? ": " + event.message : ""), "error");
}

// Installed app: the BOS page opens the socket (see the header comment).
function connectViaBos() {
  if (!window.__bos.services || typeof window.__bos.services.connect !== "function") {
    setStatus("This BOS is too old for the Terminal app — it has no window.__bos.services.connect. Update BOS.", "error");
    return;
  }
  attach(window.__bos.services.connect("terminal"), "terminal service");
}

// Opened directly in a same-origin tab: read the config and connect ourselves.
async function connectDirect() {
  setStatus("Looking up service…");
  let data;
  try {
    const res = await fetch("/api/services/terminal/config");
    if (!res.ok) throw new Error(`config fetch failed: HTTP ${res.status}`);
    data = await res.json();
  } catch (err) {
    setStatus("Could not reach BOS API: " + err.message, "error");
    return;
  }
  if (!data.runtime || typeof data.runtime.port !== "number") {
    setStatus("Terminal Service is not running — start it in Settings → Services first.", "error");
    return;
  }
  // https:// pages must use wss:// (mixed content is refused). Through the
  // Supervisor (any Docker deployment) the service is reached at wsPath on
  // BOS's own host; under plain `npm run dev` wsPath is null and the service's
  // own port is reachable directly.
  const wsScheme = location.protocol === "https:" ? "wss:" : "ws:";
  const wsUrl = data.wsPath
    ? `${wsScheme}//${location.host}${data.wsPath}`
    : `${wsScheme}//${location.hostname}:${data.runtime.port}`;
  try {
    attach(new WebSocket(wsUrl), wsUrl);
  } catch (err) {
    setStatus("Failed to open WebSocket: " + err.message, "error");
  }
}

function connect() {
  if (window.__bos) connectViaBos();
  else void connectDirect();
}

inputEl.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const line = inputEl.value;
  inputEl.value = "";
  appendOutput(`$ ${line}\n`);
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(line + "\n");
  } else {
    appendOutput("[not connected]\n");
  }
});

reconnectBtn.addEventListener("click", () => {
  if (ws) ws.close();
  outputEl.textContent = "";
  connect();
});

connect();
</script>
</body>
</html>
